name: Build ModSecurity IIS MSI

on:
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-2022

    steps:
      - name: Checkout ModSecurity (v2/master)
        uses: actions/checkout@v4
        with:
          repository: owasp-modsecurity/ModSecurity
          ref: v2/master
          submodules: recursive

      - name: Prepare CMake archive locally and download remaining dependencies
        shell: pwsh
        run: |
          $downloads = Join-Path $env:USERPROFILE "Downloads"
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null

          # 0. Vytvoření cmake-3.12.4-win32-x86.zip z lokálního CMake
          $localCmake = "C:\Program Files\CMake"
          $tempCmakeDir = Join-Path $env:TEMP "cmake-3.12.4-win32-x86"
          if (Test-Path $tempCmakeDir) { Remove-Item $tempCmakeDir -Recurse -Force }
          Copy-Item -Path $localCmake -Destination $tempCmakeDir -Recurse
          $cmakeZip = Join-Path $downloads "cmake-3.12.4-win32-x86.zip"
          Compress-Archive -Path $tempCmakeDir -DestinationPath $cmakeZip -Force
          Write-Host "OK: Lokální CMake zabalen jako $cmakeZip"

          function Get-VerifiedFile {
            param(
              [string]$FileName,
              [string[]]$Urls
            )
            $dest = Join-Path $downloads $FileName
            foreach ($url in $Urls) {
              Write-Host "Stahuji $FileName z $url ..."
              try {
                curl.exe -fsSL -A "Wget/1.21.4" "$url" -o "$dest"
                if ((Test-Path $dest) -and ((Get-Item $dest).Length -gt 10000)) {
                  7z t $dest | Out-Null
                  if ($LASTEXITCODE -eq 0) {
                    Write-Host "OK: $FileName ověřen ($([math]::Round((Get-Item $dest).Length / 1MB, 2)) MB)"
                    return
                  }
                }
              } catch {
                Write-Warning "Selhalo stažení z $url"
              }
            }
            throw "Nepodařilo se stáhnout platný archiv: $FileName"
          }

          $gh = "https://" + "github.com"

          # 1. PCRE2 10.42
          $pcre2File = "pcre2-10.42.zip"
          Get-VerifiedFile $pcre2File @(
            "$gh/PCRE2Project/pcre2/releases/download/pcre2-10.42/$pcre2File"
          )

          # 2. Zlib 1.2.12
          $zlibHost = "https://" + "zlib.net"
          Get-VerifiedFile "zlib-1.2.12.tar.gz" @(
            "$zlibHost/fossils/zlib-1.2.12.tar.gz",
            "$gh/madler/zlib/archive/refs/tags/v1.2.12.tar.gz"
          )

          # 3. Libxml2 2.9.14
          Get-VerifiedFile "libxml2-2.9.14.tar.gz" @(
            "$gh/GNOME/libxml2/archive/refs/tags/v2.9.14.tar.gz"
          )

          # 4. Lua 5.3.6
          $luaHost = "https://" + "www.lua.org"
          Get-VerifiedFile "lua-5.3.6.tar.gz" @(
            "$luaHost/ftp/lua-5.3.6.tar.gz"
          )

          # 5. Curl 7.83.1
          Get-VerifiedFile "curl-7.83.1.zip" @(
            "$gh/curl/curl/releases/download/curl-7_83_1/curl-7.83.1.zip"
          )

          # 6. Apache httpd 2.4.54 source
          $apacheHost = "https://" + "archive.apache.org"
          Get-VerifiedFile "httpd-2.4.54.tar.gz" @(
            "$apacheHost/dist/httpd/httpd-2.4.54.tar.gz"
          )

          # 7. Apache httpd 2.4.54 Win32 VS16 binary
          $wbHost = "https://" + "web.archive.org"
          $alHost = "https://" + "://apachelounge.com"
          Get-VerifiedFile "httpd-2.4.54-win32-VS16.zip" @(
            "$wbHost/web/20220901000000id_/$alHost/download/VS16/binaries/httpd-2.4.54-win32-VS16.zip"
          )

          # 8. Apache httpd 2.4.54 Win64 VS16 binary
          Get-VerifiedFile "httpd-2.4.54-win64-VS16.zip" @(
            "$wbHost/web/20220901000000id_/$alHost/download/VS16/binaries/httpd-2.4.54-win64-VS16.zip"
          )

          # 9. YAJL 2.1.0
          Get-VerifiedFile "yajl-2.1.0.zip" @(
            "$gh/lloyd/yajl/archive/refs/tags/2.1.0.zip"
          )

          # 10. ssdeep 2.14.1 source
          Get-VerifiedFile "ssdeep-2.14.1.tar.gz" @(
            "$gh/ssdeep-project/ssdeep/releases/download/release-2.14.1/ssdeep-2.14.1.tar.gz"
          )

          # 11. ssdeep 2.14.1 Windows binary
          $ssdeepZipName = "ssdeep-2.14.1-win32-binary.zip"
          Get-VerifiedFile "ssdeep-2.14.1.zip" @(
            "$gh/ssdeep-project/ssdeep/releases/download/release-2.14.1/$ssdeepZipName"
          )

      - name: Patch VS, WiX, PCRE2, libinjection and IIS API
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio C++ build tools not found." }

          $vcvarsX64 = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsx86_amd64.bat"
          $vcvarsX86 = Join-Path $vsPath "VC\Auxiliary\Build\vcvars32.bat"

          $wixBin = $null
          $wixCandidates = @(
            $env:WIX,
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11"
          ) | Where-Object { $_ -and (Test-Path $_) }

          foreach ($dir in $wixCandidates) {
            if (Test-Path (Join-Path $dir "bin\candle.exe")) {
              $wixBin = Join-Path $dir "bin"
              break
            } elseif (Test-Path (Join-Path $dir "candle.exe")) {
              $wixBin = $dir
              break
            }
          }

          if ($wixBin) {
            $wixBin | Out-File -FilePath $env:GITHUB_PATH -Append
          }

          # 1. Úprava iis/*.bat (VS cesty, WiX cesty, PCRE2 + reset PATH před x86 buildem)
          $basePath = "$env:SystemRoot\system32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;C:\Program Files\Git\cmd;C:\Program Files\7-Zip;$wixBin"
          Get-ChildItem -Path "iis" -Filter "*.bat" | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $text = $text -replace 'C:\\Program Files(?: \(x86\))?\\Microsoft Visual Studio\\[^"\\]+\\[^"\\]+\\VC\\Auxiliary\\Build\\vcvarsx86_amd64\.bat', $vcvarsX64
            $text = $text -replace 'C:\\Program Files(?: \(x86\))?\\Microsoft Visual Studio\\[^"\\]+\\[^"\\]+\\VC\\Auxiliary\\Build\\vcvars32\.bat', $vcvarsX86
            $text = $text -replace '(?m)^(.*vcvars32\.bat.*)$', "set `"PATH=$basePath`"`r`n`$1"
            if ($wixBin) {
              $text = $text -replace 'C:\\Program Files(?: \(x86\))?\\WiX Toolset v[0-9.]+\\bin', $wixBin
            }
            $text = $text -replace 'pcre-8\.45', 'pcre2-10.42'
            $text = $text -replace 'pcre\.lib', 'pcre2-8.lib'
            $text = $text -replace 'pcre\.dll', 'pcre2-8.dll'
            Set-Content -Path $_.FullName -Value $text -NoNewline
          }



          # 2. Úprava Makefile.win a installer.wxs pro linkování pcre2-8
          Get-ChildItem -Path "apache2", "iis", "mlogc" -Include "Makefile.win", "*.wxs" -Recurse | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $text = $text -replace 'pcre\.lib', 'pcre2-8.lib'
            $text = $text -replace 'pcre\.dll', 'pcre2-8.dll'
            $text = $text -replace '-DVERSION_IIS', '-DVERSION_IIS -DPCRE2_CODE_UNIT_WIDTH=8'
            Set-Content -Path $_.FullName -Value $text -NoNewline
            Write-Host "Patched PCRE2 in $($_.FullName)"
          }

          # 3. Zkopírování zdrojových kódů libinjection ze submodulu do apache2\libinjection
          $libinjFile = Get-ChildItem -Filter "libinjection_html5.c" -Recurse | Select-Object -First 1
          if ($libinjFile) {
            New-Item -ItemType Directory -Force -Path "apache2\libinjection" | Out-Null
            Copy-Item -Path (Join-Path $libinjFile.DirectoryName "*") -Destination "apache2\libinjection" -Force
            Write-Host "Zkopírováno libinjection z $($libinjFile.DirectoryName) do apache2\libinjection"
          }

         
          
          # 4. Přesměrování ap_map_http_request_error na vlastní funkci bez kolize s http_protocol.h
          $ioContent = Get-Content "apache2\apache2_io.c" -Raw
          $ioContent = $ioContent -replace '\bap_map_http_request_error\b', 'ap_map_http_request_error_iis'
          $stub = "`r`nstatic int ap_map_http_request_error_iis(apr_status_t rv, int status) { switch (rv) { case APR_EGENERAL: return HTTP_BAD_REQUEST; case APR_ENOSPC: return HTTP_REQUEST_ENTITY_TOO_LARGE; case APR_ENOTIMPL: return HTTP_NOT_IMPLEMENTED; case APR_ETIMEDOUT: case APR_TIMEUP: return HTTP_REQUEST_TIME_OUT; default: return status; } }`r`n"
          Set-Content -Path "apache2\apache2_io.c" -Value ($ioContent + $stub) -NoNewline
          Write-Host "Funkce ap_map_http_request_error bezpečně přesměrována v apache2\apache2_io.c"



      - name: Build dependencies and ModSecurity
        working-directory: iis
        shell: cmd
        run: build_release.bat

      - name: Build MSI installer
        working-directory: iis
        shell: cmd
        run: build_msi.bat

      - name: Upload MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ModSecurity-IIS-MSI
          path: iis/**/*.msi
