name: Build ModSecurity IIS MSI

on:
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Stažení zdrojových kódů (v2/master)
        uses: actions/checkout@v4
        with:
          repository: owasp-modsecurity/ModSecurity
          ref: v2/master
          submodules: recursive

      - name: Nastavení MSVC kompilátoru
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Přidání WiX Toolsetu do PATH
        shell: cmd
        run: |
          echo C:\Program Files (x86)\WiX Toolset v3.11\bin>> %GITHUB_PATH%
          echo C:\Program Files (x86)\WiX Toolset v3.14\bin>> %GITHUB_PATH%

      - name: Kompilace závislostí a ModSecurity
        working-directory: iis
        shell: cmd
        run: build_release.bat

      - name: Vytvoření MSI instalátoru
        working-directory: iis
        shell: cmd
        run: build_msi.bat

      - name: Nahrání výsledného MSI ke stažení
        uses: actions/upload-artifact@v4
        with:
          name: ModSecurity-IIS-MSI
          path: iis/**/*.msi
