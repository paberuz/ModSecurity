name: Build ModSecurity IIS MSI

on:
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-2022

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          path: scripts

      - name: Checkout ModSecurity (v2/master)
        uses: actions/checkout@v4
        with:
          repository: owasp-modsecurity/ModSecurity
          ref: v2/master
          submodules: recursive

      - name: Prepare and Patch
        shell: pwsh
        run: .\scripts\.github\workflows\build-script.ps1

      - name: Build ModSecurity
        working-directory: iis
        shell: cmd
        run: build_release.bat

      - name: Build MSI
        working-directory: iis
        shell: pwsh
        run: |
          $ssTar = Join-Path $env:USERPROFILE "Downloads\ssdeep-2.14.1.tar.gz"
          $ssDir = Join-Path $env:TEMP "ssdeep64"
          if (Test-Path $ssDir) { Remove-Item $ssDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $ssDir | Out-Null
          tar -xzf $ssTar -C $ssDir
          $src = Get-ChildItem $ssDir -Directory | Select-Object -First 1
          New-Item -ItemType File (Join-Path $src.FullName "unistd.h") -Force | Out-Null
          New-Item -ItemType File (Join-Path $src.FullName "config.h") -Force | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vc64 = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsx86_amd64.bat"
          cmd /c "`"$vc64`" && cd /d `"$($src.FullName)`" && cl /O2 /LD /D_WIN32 /DFUZZY_EXPORTS /Dfseeko=_fseeki64 /Dftello=_ftelli64 /I. fuzzy.c edit_dist.c find-file-size.c /link /OUT:fuzzy64.dll"
          Copy-Item (Join-Path $src.FullName "fuzzy64.dll") "release\amd64\fuzzy.dll" -Force

          $p64 = Join-Path $env:TEMP "pcre64"
          7z e (Join-Path $env:USERPROFILE "Downloads\httpd-2.4.54-win64-VS16.zip") "Apache24\bin\pcre2-8.dll" -o"$p64" -y | Out-Null
          Copy-Item (Join-Path $p64 "pcre2-8.dll") "release\amd64\pcre2-8.dll" -Force
          $p32 = Get-ChildItem "dependencies" -Filter "pcre2-8.dll" -Recurse | Select-Object -First 1
          if ($p32) { Copy-Item $p32.FullName "release\x86\pcre2-8.dll" -Force }

          heat.exe dir "release\amd64" -cg ModSec64Components -dr inetsrv64 -gg -sreg -srd -var var.ModSecurityIISRelease64 -out "ModSec64.wxs"
          heat.exe dir "release\x86" -cg ModSec32Components -dr inetsrv32 -gg -sreg -srd -var var.ModSecurityIISRelease32 -out "ModSec32.wxs"
          candle.exe -ext WixUtilExtension -ext WixUIExtension -dModSecurityIISRelease64="release\amd64" -arch x64 "installer.wxs" "ModSec64.wxs"
          candle.exe -ext WixUtilExtension -ext WixUIExtension -dModSecurityIISRelease32="release\x86" -arch x86 "ModSec32.wxs"
          light.exe -ext WixUtilExtension -ext WixUIExtension "installer.wixobj" "ModSec64.wixobj" "ModSec32.wixobj" -out "ModSecurityIIS-2.9.15-x64.msi"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: ModSecurity-IIS-MSI
          path: iis/**/*.msi
